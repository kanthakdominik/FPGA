# Konfiguracja strony GitHub Pages. Menu (nav) dopisuje tools/build_site.py.
site_name: FPGA — od bramki do systemu na chipie
site_url: https://kanthakdominik.github.io/FPGA/
site_description: Otwarta baza wiedzy o FPGA po polsku — VHDL, Verilog, SystemVerilog, weryfikacja, analiza czasowa, projekty na płytce Arrow DECA (MAX 10)
repo_url: https://github.com/kanthakdominik/FPGA
repo_name: kanthakdominik/FPGA
edit_uri: ""
docs_dir: src
site_dir: public
copyright: Treść własna repozytorium — CC BY-SA 4.0, kod — MIT

theme:
  name: material
  language: pl
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - sane_lists
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - javascripts/extra.css
