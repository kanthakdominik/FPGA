name: Testy materiałów

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hdl:
    name: Testbenche HDL (GHDL, Icarus, Verilator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalacja symulatorów
        run: sudo apt-get update && sudo apt-get install -y ghdl iverilog verilator
      - name: Wersje
        run: |
          ghdl --version | head -1
          iverilog -V 2>&1 | head -1
          verilator --version
      - name: Uruchomienie testbenchy
        run: python3 tools/run_hdl_tests.py --strict
      - name: Lint Verilatorem (-Wall) — moduły od 07 bez ostrzeżeń, starsze tylko raport
        run: python3 tools/lint_hdl.py --strict-od 7
      - name: Moduł 09 — wektory testowe zgodne z generatorem
        run: python3 modules/09-symulacja-i-testbench/hdl/dane/gen_mavg4.py --sprawdz
      - name: Moduł 09 — regresja z Makefile i zapis przebiegów
        run: |
          make -C modules/09-symulacja-i-testbench/sim regresja
          for j in verilog vhdl sv; do make -s -C modules/09-symulacja-i-testbench/sim FALE=1 JEZYK=$j > /dev/null; done
          ls -l modules/09-symulacja-i-testbench/sim/build/tb_mavg4.vcd \
                modules/09-symulacja-i-testbench/sim/build/tb_mavg4.ghw \
                modules/09-symulacja-i-testbench/sim/build/tb_mavg4.fst
      - name: Moduł 09 — przebiegi do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: przebiegi-tb_mavg4
          path: |
            modules/09-symulacja-i-testbench/sim/build/tb_mavg4.vcd
            modules/09-symulacja-i-testbench/sim/build/tb_mavg4.ghw
            modules/09-symulacja-i-testbench/sim/build/tb_mavg4.fst

  synteza:
    name: Synteza Verilog (Yosys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalacja Yosysa
        run: sudo apt-get update && sudo apt-get install -y yosys iverilog && yosys -V
      - name: Synteza wszystkich modułów na LUT4
        run: python3 tools/synteza_yosys.py --strict
      - name: Moduł 09 — symulacja netlisty po syntezie
        run: make -C modules/09-symulacja-i-testbench/sim po_syntezie


  weryfikacja:
    name: Weryfikacja SystemVerilog i UVM (Verilator z OSS CAD Suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # wydanie OSS CAD Suite z określonego dnia: Verilator >= 5.050 (losowanie z ograniczeniami, covergroup)
      # i rozwiązywacz z3; zmiana daty = świadoma aktualizacja narzędzi
      OSS_CAD_SUITE: "2026-11-16"
      # biblioteka UVM (IEEE 1800.2) z repozytorium Accellera; wersja = tag w uvm-core
      UVM_VERSION: "2020.3.1"
    steps:
      - uses: actions/checkout@v5
      - name: Pamięć podręczna OSS CAD Suite
        id: cache
        uses: actions/cache@v5
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE }}
      - name: Instalacja OSS CAD Suite
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OSS_CAD_SUITE" -R YosysHQ/oss-cad-suite-build \
            -p "oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" -D /tmp
          sudo tar -xzf /tmp/oss-cad-suite-linux-x64-*.tgz -C /opt
      - name: Wersje
        run: |
          echo /opt/oss-cad-suite/bin >> "$GITHUB_PATH"
          /opt/oss-cad-suite/bin/verilator --version
          /opt/oss-cad-suite/bin/z3 --version
      - name: Pamięć podręczna biblioteki UVM
        id: cache-uvm
        uses: actions/cache@v5
        with:
          path: /opt/uvm-core
          key: uvm-core-${{ env.UVM_VERSION }}
      - name: Biblioteka UVM (Accellera uvm-core)
        if: steps.cache-uvm.outputs.cache-hit != 'true'
        run: git clone -q --depth 1 --branch "$UVM_VERSION" https://github.com/accellera-official/uvm-core.git /opt/uvm-core
      - name: Moduł 10 — regresja testbenchy weryfikacyjnych
        run: make -C modules/10-weryfikacja-systemverilog/sim regresja
      - name: Moduł 10 — środowisko z pięcioma ziarnami
        run: make -C modules/10-weryfikacja-systemverilog/sim ziarna
      - name: Moduł 10 — pokrycie kodu i funkcjonalne
        run: |
          make -C modules/10-weryfikacja-systemverilog/sim pokrycie
          {
            echo "## Pokrycie — moduł 10 (tb_env)"
            echo '```'
            cat modules/10-weryfikacja-systemverilog/sim/build/pokrycie/podsumowanie.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Moduł 11 — regresja UVM
        run: make -C modules/11-uvm/sim UVM_HOME=/opt/uvm-core/src regresja
      - name: Moduł 11 — wykrywanie wstrzykniętych błędów
        run: make -C modules/11-uvm/sim UVM_HOME=/opt/uvm-core/src bledy
      - name: Moduł 10 — raport pokrycia do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: pokrycie-tb_env
          path: |
            modules/10-weryfikacja-systemverilog/sim/build/pokrycie/podsumowanie.txt
            modules/10-weryfikacja-systemverilog/sim/build/pokrycie/pokrycie.info
            modules/10-weryfikacja-systemverilog/sim/build/pokrycie/coverage.dat
            modules/10-weryfikacja-systemverilog/sim/build/pokrycie/adnotacje/


  otwarte:
    name: Weryfikacja open source (cocotb, VUnit, OSVVM, UVVM, Verilator C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OSS_CAD_SUITE: "2026-11-16"
      UVVM_VERSION: "v2024.07.04"
    steps:
      - uses: actions/checkout@v5
      - name: Pamięć podręczna OSS CAD Suite
        id: cache
        uses: actions/cache@v5
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE }}
      - name: Instalacja OSS CAD Suite
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OSS_CAD_SUITE" -R YosysHQ/oss-cad-suite-build \
            -p "oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" -D /tmp
          sudo tar -xzf /tmp/oss-cad-suite-linux-x64-*.tgz -C /opt
      - name: Python (cocotb, VUnit, numpy) i UVVM
        run: |
          /usr/bin/python3 -m venv /opt/venv
          /opt/venv/bin/pip install -q -r modules/12-weryfikacja-open-source/requirements.txt
          echo /opt/oss-cad-suite/bin >> "$GITHUB_PATH"
          echo /opt/venv/bin >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch "$UVVM_VERSION" https://github.com/UVVM/UVVM.git /opt/uvvm
      - name: Wersje
        run: |
          python3 --version; pip list 2>/dev/null | grep -iE "^(cocotb|vunit_hdl|numpy) "
          ghdl --version | head -1; iverilog -V 2>&1 | head -1; verilator --version
      - name: cocotb — 3 symulatory × 3 wersje układu
        run: |
          set -o pipefail                     # kod wyjścia skryptu, nie tee
          cd modules/12-weryfikacja-open-source/cocotb
          python3 run_cocotb.py | tee wynik.txt
          { echo "## cocotb (moduł 12)"; echo '```'; cat wynik.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: VUnit + OSVVM + UVVM (GHDL)
        run: |
          set -o pipefail
          cd modules/12-weryfikacja-open-source/vunit
          UVVM_HOME=/opt/uvvm python3 run.py -p 4 --xunit-xml wyniki.xml --no-color | tee wynik.txt | grep -E "^(pass|fail|skip) |passed!|failed!"
          { echo "## VUnit (moduł 12)"; echo '```'; sed -n '/==== Summary/,$p' wynik.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verilator z testbenchem C++
        run: |
          set -o pipefail
          cd modules/12-weryfikacja-open-source/verilator
          make test
          if make BUG=1 N=100000 test; then echo "BUG=1 nie wykryty"; exit 1; else echo "BUG=1 wykryty (oczekiwane)"; fi
          make porownanie | tee porownanie.txt
          { echo "## Szybkość symulatorów (moduł 12)"; echo '```'; cat porownanie.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Raporty JUnit do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-modul-12
          path: |
            modules/12-weryfikacja-open-source/cocotb/build/*/results.xml
            modules/12-weryfikacja-open-source/vunit/wyniki.xml

  formalna:
    name: Weryfikacja formalna (SymbiYosys, Yosys, GHDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OSS_CAD_SUITE: "2026-11-16"
    steps:
      - uses: actions/checkout@v5
      - name: Pamięć podręczna OSS CAD Suite
        id: cache
        uses: actions/cache@v5
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE }}
      - name: Instalacja OSS CAD Suite
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OSS_CAD_SUITE" -R YosysHQ/oss-cad-suite-build \
            -p "oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" -D /tmp
          sudo tar -xzf /tmp/oss-cad-suite-linux-x64-*.tgz -C /opt
      - name: Wersje
        run: |
          echo /opt/oss-cad-suite/bin >> "$GITHUB_PATH"
          /opt/oss-cad-suite/bin/sby --version; /opt/oss-cad-suite/bin/yosys -V
      - name: Dowody, kontrprzykłady, cover i równoważność (moduł 13)
        run: |
          set -o pipefail
          cd modules/13-weryfikacja-formalna/formal
          python3 sprawdz.py | tee wynik.txt
          { echo "## Weryfikacja formalna (moduł 13)"; echo '```'; grep -E "^(==|  [a-z]|PASS|FAIL)" wynik.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ślady (VCD) do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slady-formalne-modul-13
          path: modules/13-weryfikacja-formalna/formal/*_*/engine_0/*.vcd

  sta:
    name: Analiza czasowa, CDC i wydajność (OpenSTA, nextpnr-ecp5, Yosys)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OSS_CAD_SUITE: "2026-11-16"
      OPENSTA: "30653db4"                 # commit OpenSTA (parallaxsw/OpenSTA)
      CUDD: "3.0.0"
    steps:
      - uses: actions/checkout@v5
      - name: Pamięć podręczna OSS CAD Suite
        id: cache
        uses: actions/cache@v5
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE }}
      - name: Instalacja OSS CAD Suite
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OSS_CAD_SUITE" -R YosysHQ/oss-cad-suite-build \
            -p "oss-cad-suite-linux-x64-${OSS_CAD_SUITE//-/}.tgz" -D /tmp
          sudo tar -xzf /tmp/oss-cad-suite-linux-x64-*.tgz -C /opt
      - name: Pamięć podręczna OpenSTA
        id: cache_sta
        uses: actions/cache@v5
        with:
          path: /opt/opensta
          key: opensta-${{ env.OPENSTA }}-cudd-${{ env.CUDD }}-ubuntu24
      - name: Budowa OpenSTA (z bibliotekami NanGate 45 nm z przykładów)
        if: steps.cache_sta.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake tcl-dev swig bison flex libfl-dev libeigen3-dev zlib1g-dev autoconf automake > /dev/null
          cd /tmp
          git clone -q https://github.com/cuddorg/cudd.git && cd cudd && git checkout -q "$CUDD"
          autoreconf -fi > /dev/null 2>&1; ./configure --prefix=/tmp/cudd-inst -q > /dev/null
          make -j4 -s > /dev/null 2>&1 && make install -s > /dev/null 2>&1
          cd /tmp && git clone -q https://github.com/parallaxsw/OpenSTA.git && cd OpenSTA && git checkout -q "$OPENSTA"
          mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DCUDD_DIR=/tmp/cudd-inst > /dev/null
          make -j4 > /dev/null 2>&1
          sudo mkdir -p /opt/opensta/bin /opt/opensta/lib && sudo cp sta /opt/opensta/bin/
          for c in slow typ fast; do zcat ../examples/nangate45_$c.lib.gz | sudo tee /opt/opensta/lib/nangate45_$c.lib > /dev/null; done
      - name: Wersje
        run: |
          echo /opt/oss-cad-suite/bin >> "$GITHUB_PATH"
          echo /opt/opensta/bin >> "$GITHUB_PATH"
          /opt/opensta/bin/sta -version; /opt/oss-cad-suite/bin/nextpnr-ecp5 --version
      - name: Obliczenia z tekstów (moduł 14)
        run: python3 modules/14-analiza-czasowa/sta/obliczenia.py
      - name: Eksperymenty STA — OpenSTA i nextpnr-ecp5 (moduł 14)
        run: |
          set -o pipefail
          cd modules/14-analiza-czasowa/sta
          python3 sprawdz_sta.py | tee wynik.txt
          { echo "## Analiza czasowa (moduł 14)"; echo '```'; cat wynik.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: CDC — MTBF, strukturalna analiza przejść i ograniczenia w OpenSTA (moduł 15)
        run: |
          set -o pipefail
          cd modules/15-zegary-reset-cdc/cdc
          python3 mtbf.py | tee mtbf.txt
          python3 sprawdz_cdc.py | tee cdc.txt
          python3 sprawdz_sta_cdc.py | tee sta_cdc.txt
          { echo "## CDC (moduł 15)"; echo '```'; tail -8 mtbf.txt; grep -E "^(==|  podsumowanie|  OK|  <--|PASS|FAIL)" cdc.txt; cat sta_cdc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Wydajność, zasoby i moc — Yosys, nextpnr-ecp5, aktywność z symulacji (moduł 16)
        run: |
          set -o pipefail
          cd modules/16-wydajnosc-zasoby-moc/wydajnosc
          python3 moc.py | tee moc.txt
          python3 eksperymenty.py | tee eksp.txt
          { echo "## Wydajność i moc (moduł 16)"; echo '```'; cat moc.txt eksp.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Raporty OpenSTA i nextpnr do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-sta-modul-14
          path: |
            modules/14-analiza-czasowa/sta/build/*.log
            modules/14-analiza-czasowa/sta/build/*.json
            modules/14-analiza-czasowa/sta/build/sta_demo_net.v
            modules/15-zegary-reset-cdc/cdc/build/e07_cdc.log
            modules/16-wydajnosc-zasoby-moc/wydajnosc/build/wyniki.json
            modules/16-wydajnosc-zasoby-moc/wydajnosc/build/*_pnr.log

  linki:
    name: Linki wewnętrzne
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sprawdzenie linków między plikami .md
        run: python3 tools/check_links.py
