name: Testy materiałów

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hdl:
    name: Testbenche HDL (GHDL, Icarus, Verilator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalacja symulatorów
        run: sudo apt-get update && sudo apt-get install -y ghdl iverilog verilator
      - name: Wersje
        run: |
          ghdl --version | head -1
          iverilog -V 2>&1 | head -1
          verilator --version
      - name: Uruchomienie testbenchy
        run: python3 tools/run_hdl_tests.py --strict
      - name: Lint Verilatorem (-Wall) — moduł 07 bez ostrzeżeń
        run: python3 tools/lint_hdl.py modules/07-kodowanie-pod-synteze --strict
      - name: Lint Verilatorem (-Wall) — pozostałe moduły, tylko raport
        run: python3 tools/lint_hdl.py

  synteza:
    name: Synteza Verilog (Yosys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalacja Yosysa
        run: sudo apt-get update && sudo apt-get install -y yosys && yosys -V
      - name: Synteza wszystkich modułów na LUT4
        run: python3 tools/synteza_yosys.py --strict

  linki:
    name: Linki wewnętrzne
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sprawdzenie linków między plikami .md
        run: python3 tools/check_links.py
